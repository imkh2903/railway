<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publikasi · Gudep MAN 1</title><link rel="stylesheet" href="/css/base/public-site.css"><style>.newsroom-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px 16px 0 0;border-bottom:1px solid var(--g-border);background:rgba(255,255,255,.04)}.newsroom-card{overflow:hidden}.newsroom-card-body{padding:18px}.newsroom-featured{grid-column:span 2}.newsroom-featured .newsroom-thumb{aspect-ratio:16/8}.newsroom-meta{display:flex;gap:7px;flex-wrap:wrap}.pub-tools{display:flex;gap:10px;flex-wrap:wrap}.pub-tools input,.pub-tools select{background:rgba(0,0,0,.18);border:1px solid var(--g-border);color:var(--g-text);padding:11px 12px;border-radius:12px}.pub-stat{display:flex;justify-content:space-between;align-items:center}.pub-stat strong{font-size:30px}.media-badge{position:absolute;left:14px;top:14px;background:rgba(10,12,25,.75);backdrop-filter:blur(10px);border:1px solid var(--g-border);padding:6px 9px;border-radius:999px;font-size:11px}.thumb-wrap{position:relative}@media(max-width:700px){.newsroom-featured{grid-column:auto}}</style></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark"><img src="/assets/logo-gudep.webp" alt="Logo Gudep"></span><span>GUDEP MAN 1<br><small class="muted">PADANG PARIAMAN</small></span>
</a><nav class="nav-links"><a href="/">Beranda</a><a href="profil.html">Profil</a><a href="struktur.html">Struktur</a><a href="kegiatan.html">Kegiatan</a><a href="agenda.html">Agenda</a><a href="publikasi.html">Publikasi</a><a href="prestasi.html">Prestasi</a><a href="bergabung.html">Bergabung</a></nav><a class="btn" href="/admin/login">Admin</a></div></header><main><section class="section"><div class="container"><div class="eyebrow">Newsroom</div><h1>Publikasi Gudep</h1><p class="muted">Semua konten di bawah ini berasal dari publikasi berstatus <b>published</b> di database aktif.</p><div id="pubStats" class="grid grid-4"></div><div id="featured" class="grid grid-2" style="margin-top:24px"></div><div class="toolbar"><div><h2>Semua publikasi</h2></div><div class="pub-tools"><input id="search" placeholder="Cari publikasi..."><select id="filter"><option value="">Semua tipe</option><option value="warta">Warta</option><option value="resource">Resource</option><option value="download">Download</option><option value="gallery">Gallery</option><option value="video">Video</option><option value="document">Dokumen</option><option value="link">Link</option></select></div></div><div id="list" class="grid grid-3"></div></div></section></main><footer class="footer"><div class="container">© 2026 Gudep MAN 1 Padang Pariaman</div></footer><script src="/js/app.js?v=10"></script><script>let pubs=[];const filterEl=document.querySelector('#filter'),searchEl=document.querySelector('#search'),featuredEl=document.querySelector('#featured'),listEl=document.querySelector('#list');const labels={warta:'Warta',resource:'Resource',download:'Download',gallery:'Gallery',video:'Video',document:'Dokumen',link:'Link'};function card(p,featured=false){const thumb=p.thumbnailUrl||'/assets/publication-default.svg';return `<article class="card glass newsroom-card ${featured?'newsroom-featured':''}"><div class="thumb-wrap"><img class="newsroom-thumb" src="${esc(thumb)}" alt="Thumbnail ${esc(p.title)}" loading="lazy" onerror="this.onerror=null;this.src='/assets/publication-default.svg'">${['video','gallery'].includes(p.contentType)?`<span class="media-badge">${labels[p.contentType]}</span>`:''}</div><div class="newsroom-card-body"><div class="newsroom-meta"><span class="badge">${esc(labels[p.contentType]||p.contentType)}</span>${p.featured?'<span class="badge">★ Featured</span>':''}</div><h3>${esc(p.title)}</h3><p>${esc(p.excerpt||'')}</p><div class="actions"><a class="btn" href="publikasi-detail.html?slug=${encodeURIComponent(p.slug)}">Baca detail →</a>${p.documentId?'<span class="muted">Dokumen tersedia</span>':''}${p.externalUrl&&p.contentType==='link'?`<a class="btn" href="${esc(p.externalUrl)}" target="_blank" rel="noopener">Buka link ↗</a>`:''}</div></div></article>`}function render(){const type=filterEl.value,q=searchEl.value.trim().toLowerCase();const xs=pubs.filter(p=>(!type||p.contentType===type)&&(!q||[p.title,p.excerpt,p.category].some(v=>String(v||'').toLowerCase().includes(q))));featuredEl.innerHTML=pubs.filter(p=>p.featured).slice(0,2).map(p=>card(p,true)).join('');listEl.innerHTML=xs.map(p=>card(p)).join('')||'<div class="card glass"><p class="muted">Tidak ada publikasi yang cocok.</p></div>'}async function load(){pubs=await api('/api/publications');const counts=pubs.reduce((a,p)=>(a[p.contentType]=(a[p.contentType]||0)+1,a),{});document.querySelector('#pubStats').innerHTML=[['Total',pubs.length],['Warta',counts.warta||0],['Media', (counts.gallery||0)+(counts.video||0)],['Dokumen', (counts.document||0)+(counts.download||0)+(counts.resource||0)]].map(x=>`<div class="stat glass pub-stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');render()}filterEl.onchange=render;searchEl.oninput=render;load().catch(e=>showLoadError('#list',e.message));</script></body></html>
