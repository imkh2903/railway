<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Struktur Organisasi · Gudep MAN 1</title><link rel="stylesheet" href="/css/base/public-site.css"><style>.org-tree{display:grid;gap:28px}.org-group{padding:22px;border-radius:24px}.org-group h2{margin:0 0 18px;font-size:18px}.org-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.org-card{display:flex;gap:16px;align-items:center;padding:18px;border:1px solid var(--g-border);border-radius:18px;background:rgba(255,255,255,.035)}.org-card img{width:58px;height:58px;border-radius:16px;object-fit:cover;border:1px solid var(--g-border)}.org-card .avatar{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(245,158,11,.28));font-weight:900}.org-card h3{margin:0 0 5px}.org-card p{margin:0}.org-lead{border-color:rgba(245,158,11,.35);background:linear-gradient(135deg,rgba(124,58,237,.13),rgba(245,158,11,.08))}@media(max-width:700px){.org-grid{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark"><img src="/assets/logo-gudep.webp" alt="Logo Gudep"></span><span>GUDEP MAN 1<br><small class="muted">PADANG PARIAMAN</small></span>
</a><nav class="nav-links"><a href="/">Beranda</a><a href="profil.html">Profil</a><a href="struktur.html">Struktur</a><a href="kegiatan.html">Kegiatan</a><a href="agenda.html">Agenda</a><a href="publikasi.html">Publikasi</a><a href="prestasi.html">Prestasi</a><a href="bergabung.html">Bergabung</a></nav><a class="btn" href="/admin/login">Admin</a></div></header><main><section class="section"><div class="container"><div class="eyebrow">Organization</div><h1>Struktur Organisasi</h1><p class="muted">Data struktur dikelola melalui Control Center admin dan ditampilkan langsung dari database aktif.</p><div id="orgTree" class="org-tree"></div></div></section></main><footer class="footer"><div class="container">© 2026 Gudep MAN 1 Padang Pariaman</div></footer><script src="/js/app.js?v=10"></script><script>const tree=document.getElementById('orgTree');function initials(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function render(xs){const groups=[...new Set(xs.map(x=>x.group||'Umum'))];tree.innerHTML=groups.map(g=>`<section class="org-group glass"><h2>${esc(g)}</h2><div class="org-grid">${xs.filter(x=>(x.group||'Umum')===g).sort((a,b)=>(a.order||0)-(b.order||0)).map(x=>`<article class="org-card ${x.title?.toLowerCase().includes('kamabigus')?'org-lead':''}">${x.photoUrl?`<img src="${esc(x.photoUrl)}" alt="${esc(x.name)}">`:`<div class="avatar">${initials(x.name)}</div>`}<div><h3>${esc(x.title)}</h3><p class="muted">${esc(x.name)}</p></div></article>`).join('')}</div></section>`).join('')||'<div class="card glass"><p class="muted">Belum ada data struktur organisasi resmi di database.</p></div>'}api('/api/organization').then(xs=>render(xs.filter(x=>x.visible!==false))).catch(e=>showLoadError('#orgTree',e.message));</script></body></html>
