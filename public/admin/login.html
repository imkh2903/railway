<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin · Gudep</title><link rel="stylesheet" href="/css/base/public-site.css"><link rel="stylesheet" href="/css/pages/admin.css"></head><body><main class="login-page"><form id="form" class="auth-card glass"><a class="brand brand-center" href="/"><span class="brand-mark"><img src="/assets/logo-gudep.webp" alt="Logo Gudep"></span><span>GUDEP ADMIN</span></a><div class="eyebrow">CONTROL CENTER</div><h1>Masuk ke Admin</h1><p class="muted">Kelola publikasi, agenda, anggota, prestasi, media, dokumen, dan pendaftaran.</p><div id="msg"></div><div class="form-grid"><div class="field full"><label>Username</label><input name="username" autocomplete="username" required autofocus></div><div class="field full"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><div class="field full"><button class="btn btn-primary">Masuk</button></div></div><p class="muted" style="font-size:12px">Akun dikelola dari backend <code>data/db.json</code>. Tidak ada pendaftaran akun publik.</p></form></main><script src="/js/app.js"></script><script>api('/api/auth/status').then(s=>{if(s.authenticated)location='/admin';}).catch(()=>{});form.onsubmit=async e=>{e.preventDefault();msg.innerHTML='';try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});location='/admin'}catch(x){msg.innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}</script></body></html>
