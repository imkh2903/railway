<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setup Admin · Gudep</title><link rel="stylesheet" href="/css/base/public-site.css"><link rel="stylesheet" href="/css/pages/admin.css"></head><body><main class="login-page"><form id="form" class="auth-card glass"><a class="brand brand-center" href="/"><span class="brand-mark"><img src="/assets/logo-gudep.webp" alt="Logo Gudep"></span><span>GUDEP ADMIN</span></a><div class="eyebrow">FIRST RUN</div><h1>Buat akun administrator</h1><p class="muted">Hanya aktif jika <code>users</code> di data/db.json masih kosong. Setelah akun tersedia, kelola akun langsung dari backend/admin.</p><div id="msg"></div><div class="form-grid"><div class="field full"><label>Nama</label><input name="name" required value="Administrator Gudep"></div><div class="field full"><label>Username</label><input name="username" required minlength="3" autocomplete="username"></div><div class="field full"><label>Password <small>(minimal 10 karakter)</small></label><input name="password" type="password" required minlength="10" autocomplete="new-password"></div><div class="field full"><button class="btn btn-primary">Buat Akun</button></div></div></form></main><script src="/js/app.js"></script><script>api('/api/auth/status').then(s=>{if(!s.setup){form.innerHTML='<h2>Setup sudah selesai</h2><p class="muted">Akun administrator sudah tersedia di backend.</p><a class="btn btn-primary" href="/admin/login">Ke Login</a>'}});form.onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});location='/admin/login'}catch(x){msg.innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}</script></body></html>
