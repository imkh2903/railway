<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publikasi · Gudep MAN 1</title><link rel="stylesheet" href="/css/base/public-site.css"><style>.publication-hero-thumb{width:100%;max-height:520px;object-fit:cover;border-radius:20px;margin:0 0 24px;border:1px solid var(--g-border);background:rgba(255,255,255,.04)}.publication-body{border-top:1px solid var(--g-border);padding-top:24px;line-height:1.8}.publication-body img{max-width:100%;height:auto;border-radius:14px}.detail-media{display:grid;gap:14px;margin-top:24px}.detail-media img,.detail-media video{width:100%;max-height:620px;object-fit:contain;border-radius:16px;background:#080a13;border:1px solid var(--g-border)}</style></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark"><img src="/assets/logo-gudep.webp" alt="Logo Gudep"></span><span>GUDEP MAN 1<br><small class="muted">PADANG PARIAMAN</small></span>
</a><nav class="nav-links"><a href="/">Beranda</a><a href="profil.html">Profil</a><a href="struktur.html">Struktur</a><a href="kegiatan.html">Kegiatan</a><a href="agenda.html">Agenda</a><a href="publikasi.html">Publikasi</a><a href="prestasi.html">Prestasi</a></nav><a class="btn" href="/admin/login">Admin</a></div></header><main><section class="section"><div class="container"><div id="article" class="card glass" style="max-width:980px;margin:auto"></div></div></section></main><footer class="footer"><div class="container">© 2026 Gudep MAN 1 Padang Pariaman</div></footer><script src="/js/app.js?v=10"></script><script>const q=new URLSearchParams(location.search),slug=q.get('slug'),article=document.getElementById('article');const labels={warta:'Warta',resource:'Resource',download:'Download',gallery:'Gallery',video:'Video',document:'Dokumen',link:'Link'};api('/api/publications/'+encodeURIComponent(slug||'')).then(p=>{document.title=p.title+' · Gudep MAN 1';const thumb=p.thumbnailUrl||'/assets/publication-default.svg';const media=(p.media||[]).map(m=>m.mimetype?.startsWith('video/')?`<video src="${esc(m.url)}" controls preload="metadata"></video>`:m.mimetype?.startsWith('image/')?`<img src="${esc(m.url)}" alt="${esc(m.originalName)}" loading="lazy">`:'').join('');const doc=p.document?`<a class="btn btn-primary" target="_blank" rel="noopener" href="${esc(p.document.url)}">Download dokumen ↗</a>`:'';const youtubeEmbed=(()=>{if(p.contentType!=='video'||!p.externalUrl)return '';try{const u=new URL(p.externalUrl);let id='';if(u.hostname.includes('youtu.be'))id=u.pathname.slice(1);if(u.hostname.includes('youtube.com'))id=u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop();return id?`<div class="detail-media"><iframe src="https://www.youtube.com/embed/${esc(id)}" title="${esc(p.title)}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:16px" allowfullscreen loading="lazy"></iframe></div>`:''}catch{return ''}})();const external=p.externalUrl&&['link','video'].includes(p.contentType)?`<a class="btn" target="_blank" rel="noopener" href="${esc(p.externalUrl)}">${p.contentType==='video'?'Buka video ↗':'Buka tautan ↗'}</a>`:'';article.innerHTML=`<img class="publication-hero-thumb" src="${esc(thumb)}" alt="Thumbnail ${esc(p.title)}" onerror="this.onerror=null;this.src='/assets/publication-default.svg'"><span class="badge">${esc(labels[p.contentType]||p.contentType)}</span> ${p.featured?'<span class="badge">★ Featured</span>':''}<h1>${esc(p.title)}</h1><p class="muted">${esc(p.excerpt||'')}</p><div class="publication-body">${p.content||''}</div>${media?`<div class="detail-media">${media}</div>`:''}${youtubeEmbed}<div class="actions" style="margin-top:24px">${doc}${external}<a class="btn" href="publikasi.html">← Kembali</a></div>`}).catch(()=>article.innerHTML='<h1>Publikasi tidak ditemukan</h1><p class="muted">Konten mungkin masih draft atau belum waktunya diterbitkan.</p><a class="btn" href="publikasi.html">Kembali</a>')</script></body></html>
